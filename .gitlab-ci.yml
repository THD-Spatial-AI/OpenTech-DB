stages:
  - test
  - build
  - scan
  - release

variables:
  IMAGE_TAG: $CI_REGISTRY_IMAGE:$CI_COMMIT_SHORT_SHA

# ── Backend ─────────────────────────────────────────────────────────────────────
backend-test:
  stage: test
  image: python:3.11-slim
  variables:
    ADMIN_EMAIL: ci@example.com
    JWT_SECRET_KEY: ci-test-jwt-secret
    PIP_CACHE_DIR: .cache/pip
  cache:
    key: pip-$CI_COMMIT_REF_SLUG
    paths: [.cache/pip/]
  script:
    - pip install --no-cache-dir -r requirements.txt
    # api/auth.py raises RuntimeError at import if these vars are missing
    - export ADMIN_PASSWORD=ci-test-password
    - export ADMIN_PASSWORD_HASH=$(python -c "import bcrypt; print(bcrypt.hashpw(b'ci-test-password', bcrypt.gensalt(4)).decode())")
    - pytest

# ── Frontend ─────────────────────────────────────────────────────────────────────
frontend-test:
  stage: test
  image: node:lts-alpine
  cache:
    key: npm-$CI_COMMIT_REF_SLUG
    paths: [frontend/node_modules/]
  script:
    - cd frontend
    - npm ci
    - npm run lint
    - npm run build   # includes tsc -b
    - npm test

# ── Docker build ─────────────────────────────────────────────────────────────────
docker-build:
  stage: build
  image: docker:27
  services:
    - name: docker:27-dind
      alias: docker
  variables:
    DOCKER_TLS_CERTDIR: /certs
    DOCKER_HOST: tcp://docker:2376
    DOCKER_TLS_VERIFY: 1
    DOCKER_CERT_PATH: /certs/client
  script:
    - docker build -t $IMAGE_TAG .
    - docker save $IMAGE_TAG -o image.tar
  artifacts:
    paths: [image.tar]
    expire_in: 1 hour

# ── Trivy vulnerability scan ─────────────────────────────────────────────────────
trivy-scan:
  stage: scan
  image:
    name: aquasec/trivy:latest
    entrypoint: [""]
  needs:
    - job: docker-build
      artifacts: true
  script:
    - trivy image --exit-code 1 --severity CRITICAL --ignore-unfixed --input image.tar

# ── Push to GitLab Container Registry (default branch only) ──────────────────────
push-image:
  stage: release
  image: docker:27
  services:
    - name: docker:27-dind
      alias: docker
  variables:
    DOCKER_TLS_CERTDIR: /certs
    DOCKER_HOST: tcp://docker:2376
    DOCKER_TLS_VERIFY: 1
    DOCKER_CERT_PATH: /certs/client
  needs:
    - job: backend-test
    - job: frontend-test
    - job: trivy-scan
    - job: docker-build
      artifacts: true
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
  script:
    - docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY
    - docker load -i image.tar
    - docker push $IMAGE_TAG
    - docker tag $IMAGE_TAG $CI_REGISTRY_IMAGE:latest
    - docker push $CI_REGISTRY_IMAGE:latest
