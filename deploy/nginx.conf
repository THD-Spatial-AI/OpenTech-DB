# nginx (Docker) config for otdb.th-deg.de
# "backend" resolves to the FastAPI container on the compose network.

# ── HTTP: serve ACME challenges, redirect everything else to HTTPS ───────────
server {
    listen 80;
    server_name otdb.th-deg.de;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ── HTTPS ────────────────────────────────────────────────────────────────────
server {
    listen 443 ssl;
    http2 on;
    server_name otdb.th-deg.de;

    ssl_certificate     /etc/letsencrypt/live/otdb.th-deg.de/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/otdb.th-deg.de/privkey.pem;

    root /usr/share/nginx/html;
    index index.html;

    location ^~ /supabase/ {
        proxy_pass http://supabase-kong:8000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
    }

    # ── Backend API ──
    location ~ ^/(api/|health$|docs|redoc|openapi\.json$|project-docs/) {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ── Frontend: disabled. Swap the two blocks below to re-enable, then
    #    `docker compose -f docker-compose.prod.yml exec nginx nginx -s reload`
    location / {
        default_type application/json;
        return 503 '{"status":"maintenance","message":"The web UI is temporarily offline. The REST API is unaffected.","api":"/api/v1","docs":"/docs","openapi":"/openapi.json"}';
    }

    # location / {
    #     try_files $uri $uri/ /index.html;
    # }

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
}
