# nginx (Docker) config for otdb.th-deg.de
# "backend" resolves to the FastAPI container on the compose network.

# One access log file per day (access-YYYY-MM-DD.log) in the shared "logs"
# volume; the log-janitor container deletes files older than 7 days.
map $time_iso8601 $logdate {
    default                          "unknown";
    "~^(?<ymd>\d{4}-\d{2}-\d{2})"   $ymd;
}

# ── HTTP: serve ACME challenges, redirect everything else to HTTPS ───────────
server {
    listen 80;
    server_name otdb.th-deg.de;

    access_log /var/log/opentech/nginx/access-$logdate.log combined;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ── HTTPS ────────────────────────────────────────────────────────────────────
server {
    listen 443 ssl;
    http2 on;
    server_name otdb.th-deg.de;

    ssl_certificate     /etc/letsencrypt/live/otdb.th-deg.de/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/otdb.th-deg.de/privkey.pem;

    root /usr/share/nginx/html;
    index index.html;

    access_log /var/log/opentech/nginx/access-$logdate.log combined;

    # ── Standalone Go auth service ──
    # This same-origin proxy is required for the opaque HttpOnly session cookie.
    # OPENTECHDB_AUTH_UPSTREAM is substituted by the official nginx entrypoint.
    location ^~ /auth-api/ {
        proxy_pass ${OPENTECHDB_AUTH_UPSTREAM}/api/;
        # The remote Caddy virtual host matches the auth server hostname.
        proxy_set_header Host $proxy_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_ssl_server_name on;
        proxy_http_version 1.1;
    }

    # ── Backend API ──
    location ~ ^/(api/|health$|docs|redoc|openapi\.json$|project-docs/) {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ── Frontend: enabled. To take the UI offline again, swap the two blocks
    #    below, then recreate nginx (a plain reload does not pick up the change):
    #    `docker compose -f docker-compose.prod.yml up -d --force-recreate --no-deps nginx`
    location / {
        # $uri.html serves the static legal pages (/privacy, /impressum, /terms, …)
        try_files $uri $uri.html $uri/ /index.html;
    }

    # location / {
    #     default_type application/json;
    #     return 503 '{"status":"maintenance","message":"The web UI is temporarily offline. The REST API is unaffected.","api":"/api/v1","docs":"/docs","openapi":"/openapi.json"}';
    # }

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
}

# Additional site vhosts
include /etc/nginx/sites/*.conf;
