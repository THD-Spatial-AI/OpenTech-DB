# Self-hosted Supabase data stack for production (Postgres + PostgREST + Kong).
# GoTrue/Auth, Storage, Realtime, and Studio are omitted. All application users
# and roles live exclusively in Keycloak.
#
# Secrets come from /opt/opentech-db/supabase.env (generated by setup-secrets.sh):
#   docker compose -f deploy/supabase/compose.yml --env-file /opt/opentech-db/supabase.env up -d
#
# Postgres data persists in /opt/opentech-db/supabase/db-data on the host.

services:
  db:
    image: supabase/postgres:15.8.1.060
    container_name: supabase-db
    restart: unless-stopped
    environment:
      POSTGRES_HOST: /var/run/postgresql
      PGPORT: 5432
      POSTGRES_DB: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXP: 3600
    volumes:
      - /opt/opentech-db/supabase/db-data:/var/lib/postgresql/data
      - ./db/jwt.sql:/docker-entrypoint-initdb.d/init-scripts/98-jwt.sql:ro
      - ./db/roles.sql:/docker-entrypoint-initdb.d/init-scripts/99-roles.sql:ro
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres", "-h", "localhost"]
      interval: 5s
      timeout: 5s
      retries: 20

  rest:
    image: postgrest/postgrest:v12.2.0
    container_name: supabase-rest
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGRST_DB_URI: postgres://authenticator:${POSTGRES_PASSWORD}@db:5432/postgres
      PGRST_DB_SCHEMAS: public,graphql_public
      PGRST_DB_ANON_ROLE: anon
      PGRST_JWT_SECRET: ${JWT_SECRET}
      PGRST_DB_USE_LEGACY_GUCS: "false"
      PGRST_APP_SETTINGS_JWT_SECRET: ${JWT_SECRET}
      PGRST_APP_SETTINGS_JWT_EXP: 3600

  kong:
    image: kong:2.8.1
    container_name: supabase-kong
    restart: unless-stopped
    depends_on:
      - rest
    ports:
      - "127.0.0.1:54321:8000"
    environment:
      KONG_DATABASE: "off"
      KONG_DECLARATIVE_CONFIG: /home/kong/kong.yml
      KONG_DNS_ORDER: LAST,A,CNAME
      KONG_PLUGINS: request-transformer,key-auth,acl
    volumes:
      - /opt/opentech-db/kong.yml:/home/kong/kong.yml:ro
    networks:
      - default
      - opentech   # backend-only network; browser traffic is never proxied here

networks:
  default: {}
  opentech:
    external: true
