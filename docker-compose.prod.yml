# Docker's own (stdout) logs are capped by size; the dated log files in the
# "logs" volume are the ones kept for exactly 7 days.
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "20m"
    max-file: "5"

services:
  backend:
    build: .
    container_name: opentech-db
    env_file: /opt/opentech-db/.env
    restart: unless-stopped
    logging: *default-logging
    environment:
      OPENTECHDB_LOG_DIR: /var/log/opentech/backend
    depends_on:
      - log-janitor
    volumes:
      - logs:/var/log/opentech
    expose:
      - "8000"
    networks:
      - default
      - opentech   # backend-only access to Supabase PostgREST/Kong

  # Process simulator (ADR-0005). Internal only: the backend reaches it at
  # http://processsim:8770 (PROCESS_SIM_URL) and both sides share PROCESS_SIM_SECRET.
  processsim:
    build: ./services/processsim
    container_name: opentech-processsim
    restart: unless-stopped
    logging: *default-logging
    environment:
      PROCESS_ENGINE: ${PROCESS_ENGINE:-steady_state}
      PROCESS_SIM_SECRET: ${PROCESS_SIM_SECRET:?set PROCESS_SIM_SECRET in .env}
      CATALOGUE_API_URL: http://backend:8000/api/v1
    depends_on:
      - backend
    shm_size: 256m
    expose:
      - "8770"
    networks:
      - default

  nginx:
    image: nginx:alpine
    pull_policy: always
    container_name: opentech-nginx
    restart: unless-stopped
    logging: *default-logging
    depends_on:
      - backend
      - log-janitor
    environment:
      NGINX_ENVSUBST_FILTER: OPENTECHDB_AUTH_UPSTREAM
      OPENTECHDB_AUTH_UPSTREAM: ${OPENTECHDB_AUTH_UPSTREAM:?set OPENTECHDB_AUTH_UPSTREAM in .env}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/templates/default.conf.template:ro
      - /var/www/opentech-db:/usr/share/nginx/html:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - /var/www/certbot:/var/www/certbot:ro
      - /opt/nginx-sites:/etc/nginx/sites:ro 
      - /var/www/tempo:/var/www/tempo:ro
      - logs:/var/log/opentech
    networks:
      - default

  # Creates the log dirs (writable for the non-root nginx workers) and
  # deletes dated log files older than 7 days, checking once an hour.
  log-janitor:
    image: busybox:1.36
    container_name: opentech-log-janitor
    restart: unless-stopped
    logging: *default-logging
    volumes:
      - logs:/var/log/opentech
    command:
      - sh
      - -c
      - |
        mkdir -p /var/log/opentech/nginx /var/log/opentech/backend
        chmod 1777 /var/log/opentech/nginx /var/log/opentech/backend
        while true; do
          find /var/log/opentech -type f -name '*.log' -mtime +6 -print -delete
          sleep 3600
        done

volumes:
  logs: {}

networks:
  default: {}
  opentech:
    external: true   # created by the deploy pipeline; shared with deploy/supabase/compose.yml
