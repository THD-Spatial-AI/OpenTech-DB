services:
  backend:
    build: .
    container_name: opentech-db
    env_file: /opt/opentech-db/.env
    restart: unless-stopped
    expose:
      - "8000"
    networks:
      - default
      - opentech   # backend-only access to Supabase PostgREST/Kong

  nginx:
    image: nginx:alpine
    container_name: opentech-nginx
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      NGINX_ENVSUBST_FILTER: OPENTECHDB_AUTH_UPSTREAM
      OPENTECHDB_AUTH_UPSTREAM: ${OPENTECHDB_AUTH_UPSTREAM:?set OPENTECHDB_AUTH_UPSTREAM in .env}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/templates/default.conf.template:ro
      - /var/www/opentech-db:/usr/share/nginx/html:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - /var/www/certbot:/var/www/certbot:ro
    networks:
      - default

networks:
  default: {}
  opentech:
    external: true   # created by the deploy pipeline; shared with deploy/supabase/compose.yml
