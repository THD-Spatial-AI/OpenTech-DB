name: spatialai-keycloak

services:
  postgres:
    image: pgrouting/pgrouting:17-3.5-3.7.3
    container_name: spatialai-keycloak-postgres
    environment:
      POSTGRES_DB: keycloak
      POSTGRES_USER: ${KEYCLOAK_DB_USER:?set KEYCLOAK_DB_USER in .env.local}
      POSTGRES_PASSWORD: ${KEYCLOAK_DB_PASSWORD:?set KEYCLOAK_DB_PASSWORD in .env.local}
    volumes:
      - keycloak-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped
    networks:
      - auth-internal

  redis:
    image: redis:7.4-alpine
    container_name: spatialai-keycloak-redis
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?set REDIS_PASSWORD in .env.local}
    command: ["sh", "-c", "exec redis-server --appendonly yes --requirepass \"$${REDIS_PASSWORD}\""]
    volumes:
      - auth-redis:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$${REDIS_PASSWORD}\" ping | grep PONG"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped
    networks:
      - auth-internal

  keycloak:
    image: quay.io/keycloak/keycloak:26.7.0
    container_name: spatialai-keycloak
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN_USERNAME:?set KEYCLOAK_ADMIN_USERNAME in .env.local}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?set KEYCLOAK_ADMIN_PASSWORD in .env.local}
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak
      KC_DB_USERNAME: ${KEYCLOAK_DB_USER:?set KEYCLOAK_DB_USER in .env.local}
      KC_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD:?set KEYCLOAK_DB_PASSWORD in .env.local}
      KC_HEALTH_ENABLED: "true"
      KC_HTTP_ENABLED: "true"
      KC_HOSTNAME_STRICT: "false"
      OPENTECHDB_CLIENT_SECRET: ${OPENTECHDB_CLIENT_SECRET:?set OPENTECHDB_CLIENT_SECRET in .env.local}
      OPENTECHDB_AUTH_CALLBACK_URL: http://localhost:5173/auth-api/auth/callback
      OPENTECHDB_FRONTEND_URL: http://localhost:5173
    command: ["start-dev", "--import-realm"]
    volumes:
      - ./realm/opentechdb-realm.json:/opt/keycloak/data/import/opentechdb-realm.json:ro
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - bash
        - -ec
        - "exec 3<>/dev/tcp/127.0.0.1/9000; printf 'GET /health/ready HTTP/1.0\r\n\r\n' >&3; grep -q '200 OK' <&3"
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s
    restart: unless-stopped
    networks:
      - auth-internal
      - local-access

  keycloak-init:
    image: quay.io/keycloak/keycloak:26.7.0
    container_name: spatialai-keycloak-init
    entrypoint: ["bash", "/scripts/init-keycloak.sh"]
    environment:
      KEYCLOAK_URL: http://keycloak:8080
      KEYCLOAK_REALM: opentechdb
      KEYCLOAK_CLIENT_ID: opentechdb-auth
      KEYCLOAK_ADMIN_USERNAME: ${KEYCLOAK_ADMIN_USERNAME:?set KEYCLOAK_ADMIN_USERNAME in .env.local}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?set KEYCLOAK_ADMIN_PASSWORD in .env.local}
      OPENTECHDB_AUTH_CALLBACK_URL: http://localhost:5173/auth-api/auth/callback
      OPENTECHDB_FRONTEND_URL: http://localhost:5173
    volumes:
      - ./scripts/init-keycloak.sh:/scripts/init-keycloak.sh:ro
      - ./realm/opentechdb-user-profile.json:/realm/opentechdb-user-profile.json:ro
    depends_on:
      keycloak:
        condition: service_healthy
    restart: "no"
    networks:
      - auth-internal

  auth-service:
    build:
      context: .
      dockerfile: auth-service/Dockerfile
    container_name: spatialai-keycloak-auth-service
    environment:
      APP_ENV: development
      APP_HOST: 0.0.0.0
      APP_PORT: "8001"
      APP_TIMEZONE: UTC
      APP_URL: http://localhost:5173/auth-api
      FRONTEND_URL: http://localhost:5173
      KEYCLOAK_URL: http://keycloak:8080
      KEYCLOAK_PUBLIC_URL: http://localhost:8080
      KEYCLOAK_REALM: opentechdb
      KEYCLOAK_CLIENT_ID: opentechdb-auth
      KEYCLOAK_CLIENT_SECRET: ${OPENTECHDB_CLIENT_SECRET:?set OPENTECHDB_CLIENT_SECRET in .env.local}
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      REDIS_PASSWORD: ${REDIS_PASSWORD:?set REDIS_PASSWORD in .env.local}
      REDIS_DATABASE: "0"
      SESSION_TTL_MINUTES: "60"
      AUTH_INTERNAL_SECRET: ${AUTH_INTERNAL_SECRET:?set AUTH_INTERNAL_SECRET in .env.local}
    ports:
      - "127.0.0.1:8001:8001"
    depends_on:
      redis:
        condition: service_healthy
      keycloak-init:
        condition: service_completed_successfully
    restart: unless-stopped
    networks:
      - auth-internal
      - local-access

volumes:
  keycloak-postgres:
  auth-redis:

networks:
  auth-internal:
    internal: true
  local-access: {}
