name: spatialai-keycloak

services:
  postgres:
    image: pgrouting/pgrouting:17-3.5-3.7.3
    container_name: spatialai-keycloak-postgres
    environment:
      POSTGRES_DB: keycloak
      POSTGRES_USER: ${KEYCLOAK_DB_USER:?set KEYCLOAK_DB_USER in .env}
      POSTGRES_PASSWORD: ${KEYCLOAK_DB_PASSWORD:?set KEYCLOAK_DB_PASSWORD in .env}
    volumes:
      - keycloak-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 20
    restart: unless-stopped
    networks:
      - auth-internal

  redis:
    image: redis:7.4-alpine
    container_name: spatialai-keycloak-redis
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?set REDIS_PASSWORD in .env}
    command: ["sh", "-c", "exec redis-server --appendonly yes --requirepass \"$${REDIS_PASSWORD}\""]
    volumes:
      - auth-redis:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$${REDIS_PASSWORD}\" ping | grep PONG"]
      interval: 10s
      timeout: 5s
      retries: 20
    restart: unless-stopped
    networks:
      - auth-internal

  keycloak:
    image: quay.io/keycloak/keycloak:26.7.0
    container_name: spatialai-keycloak
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN_USERNAME:?set KEYCLOAK_ADMIN_USERNAME in .env}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?set KEYCLOAK_ADMIN_PASSWORD in .env}
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak
      KC_DB_USERNAME: ${KEYCLOAK_DB_USER:?set KEYCLOAK_DB_USER in .env}
      KC_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD:?set KEYCLOAK_DB_PASSWORD in .env}
      KC_HEALTH_ENABLED: "true"
      KC_HTTP_ENABLED: "true"
      KC_PROXY_HEADERS: xforwarded
      KC_HOSTNAME: https://${KEYCLOAK_DOMAIN:?set KEYCLOAK_DOMAIN in .env}
      OPENTECHDB_CLIENT_SECRET: ${OPENTECHDB_CLIENT_SECRET:?set OPENTECHDB_CLIENT_SECRET in .env}
      OPENTECHDB_AUTH_CALLBACK_URL: ${OPENTECHDB_AUTH_CALLBACK_URL:?set OPENTECHDB_AUTH_CALLBACK_URL in .env}
      OPENTECHDB_FRONTEND_URL: ${OPENTECHDB_FRONTEND_URL:?set OPENTECHDB_FRONTEND_URL in .env}
    command: ["start", "--import-realm"]
    volumes:
      - ./realm/opentechdb-realm.json:/opt/keycloak/data/import/opentechdb-realm.json:ro
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - bash
        - -ec
        - "exec 3<>/dev/tcp/127.0.0.1/9000; printf 'GET /health/ready HTTP/1.0\r\n\r\n' >&3; grep -q '200 OK' <&3"
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 40s
    restart: unless-stopped
    networks:
      - auth-internal

  keycloak-init:
    image: quay.io/keycloak/keycloak:26.7.0
    container_name: spatialai-keycloak-init
    entrypoint: ["bash", "/scripts/init-keycloak.sh"]
    environment:
      KEYCLOAK_URL: http://keycloak:8080
      KEYCLOAK_REALM: opentechdb
      KEYCLOAK_CLIENT_ID: opentechdb-auth
      KEYCLOAK_ADMIN_USERNAME: ${KEYCLOAK_ADMIN_USERNAME:?set KEYCLOAK_ADMIN_USERNAME in .env}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?set KEYCLOAK_ADMIN_PASSWORD in .env}
      OPENTECHDB_AUTH_CALLBACK_URL: ${OPENTECHDB_AUTH_CALLBACK_URL:?set OPENTECHDB_AUTH_CALLBACK_URL in .env}
      OPENTECHDB_FRONTEND_URL: ${OPENTECHDB_FRONTEND_URL:?set OPENTECHDB_FRONTEND_URL in .env}
    volumes:
      - ./scripts/init-keycloak.sh:/scripts/init-keycloak.sh:ro
      - ./realm/opentechdb-user-profile.json:/realm/opentechdb-user-profile.json:ro
    depends_on:
      keycloak:
        condition: service_healthy
    restart: "no"
    networks:
      - auth-internal

  auth-service:
    build:
      context: .
      dockerfile: auth-service/Dockerfile
    container_name: spatialai-keycloak-auth-service
    environment:
      APP_ENV: production
      APP_HOST: 0.0.0.0
      APP_PORT: "8001"
      APP_TIMEZONE: UTC
      APP_URL: ${OPENTECHDB_AUTH_PUBLIC_URL:?set OPENTECHDB_AUTH_PUBLIC_URL in .env}
      FRONTEND_URL: ${OPENTECHDB_FRONTEND_URL:?set OPENTECHDB_FRONTEND_URL in .env}
      KEYCLOAK_URL: http://keycloak:8080
      KEYCLOAK_PUBLIC_URL: https://${KEYCLOAK_DOMAIN:?set KEYCLOAK_DOMAIN in .env}
      KEYCLOAK_REALM: opentechdb
      KEYCLOAK_CLIENT_ID: opentechdb-auth
      KEYCLOAK_CLIENT_SECRET: ${OPENTECHDB_CLIENT_SECRET:?set OPENTECHDB_CLIENT_SECRET in .env}
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      REDIS_PASSWORD: ${REDIS_PASSWORD:?set REDIS_PASSWORD in .env}
      REDIS_DATABASE: "0"
      SESSION_TTL_MINUTES: "60"
      AUTH_INTERNAL_SECRET: ${AUTH_INTERNAL_SECRET:?set AUTH_INTERNAL_SECRET in .env}
    depends_on:
      redis:
        condition: service_healthy
      keycloak-init:
        condition: service_completed_successfully
    restart: unless-stopped
    networks:
      - auth-internal

  caddy:
    image: caddy:2.10-alpine
    container_name: spatialai-keycloak-caddy
    environment:
      KEYCLOAK_DOMAIN: ${KEYCLOAK_DOMAIN:?set KEYCLOAK_DOMAIN in .env}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      keycloak:
        condition: service_healthy
      auth-service:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - auth-internal
      - public

volumes:
  keycloak-postgres:
  auth-redis:
  caddy-data:
  caddy-config:

networks:
  auth-internal:
    internal: true
  public:
