    description: "Google Scholar via 'scholarly' library (experimental)"
    max_results_per_tech: 20
    lookback_months: 36
    proxy_key: null

  nrel_atb:
    enabled: true
    description: "NREL Annual Technology Baseline 2023 – structured cost data (2024 CSV not available on S3 yet)"
    base_url: "https://atb.nrel.gov"
    atb_year: 2023

  irena:
    enabled: false
    description: "IRENA Renewable Power Generation Costs – disabled (PDF scraping too slow for batch runs)"
    base_url: "https://www.irena.org"
    report_index_url: "https://www.irena.org/publications/2024/Sep/Renewable-power-generation-costs-in-2023"

  eia_api:
    enabled: true
