# ---------------------------------------------------------------------------
# Extraction settings
# ---------------------------------------------------------------------------
extraction:
  # Minimum confidence score (0-1) to create a candidate
  min_confidence: 0.55
  # Minimum number of distinct parameters that must be extracted before saving a candidate.
  # Prevents single-hit candidates from polluting the queue.
  min_params_to_save: 3
  # Minimum number of "hinted" parameters (from global_hints + per-tech parameter_hints)
  # that must appear in the extracted set. The per-tech hints narrow relevance;
  # global_hints ensure core economic data is present.
  min_hinted_params: 1
  # These parameter names are automatically merged with every technology's
  # parameter_hints list. A candidate must hit min_hinted_params of these
  # (plus any tech-specific hints) to be saved.
  global_hints:
    - capex_usd_per_kw
    - opex_fixed_usd_per_kw_yr
    - opex_var_usd_per_mwh
    - efficiency_percent
    - lifetime_years
    - typical_capacity_mw
    - construction_time_years
    - co2_emission_factor_g_per_kwh
    - capacity_factor_percent
    - lcoe_usd_per_mwh
  # If true, discard results without a DOI
  require_doi: false
  # If true, attempt to download and parse open-access PDFs
  parse_pdfs: true
  # Max PDF size in MB to attempt parsing (avoids downloading 200-page reports)
  max_pdf_mb: 10
  # LLM extraction (optional – requires OPENAI_API_KEY env var)
  llm:
    enabled: false
    provider: "openai"           # "openai" | "anthropic"
    model: "gpt-4o-mini"         # cost-effective for bulk extraction
    max_tokens_per_paper: 3000   # truncate paper text before sending to LLM
    temperature: 0.0
    # Prompt template used to instruct the LLM.
    # When set here, this overrides the default prompt in llm_extractor.py.
    # Leave as null to use the built-in default prompt (recommended).
    system_prompt: null

# ---------------------------------------------------------------------------
