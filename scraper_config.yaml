# scraper_config.yaml
# ====================
# Configuration for the OpenTech-DB automated scraping pipeline.
# Edit this file to control which sources are active, scheduling frequency,
# technology-specific search queries, and extraction thresholds.
#
# Environment variables override file settings where noted (see scrapers/config.py).
# ====================

# ---------------------------------------------------------------------------
# Scheduling
# Runs twice a month by default (1st and 15th at 02:00 UTC).
# Cron format: minute hour day-of-month month day-of-week
# ---------------------------------------------------------------------------
schedule:
  enabled: true
  jobs:
    - id: "scrape_run_1"
      cron: "0 2 1 * *"      # 1st of every month, 02:00 UTC
      description: "Monthly scrape run – start of month"
    - id: "scrape_run_2"
      cron: "0 2 15 * *"     # 15th of every month, 02:00 UTC
      description: "Monthly scrape run – mid month"

# ---------------------------------------------------------------------------
# HTTP Client settings
# ---------------------------------------------------------------------------
http:
  timeout_seconds: 30
  max_retries: 3
  retry_backoff_seconds: 2.0   # exponential base
  # Polite delay between requests to the same host (seconds)
  rate_limit_delay: 1.5
  # Cache raw responses to disk to avoid duplicate fetches within a run
  cache_enabled: true
  cache_ttl_hours: 24
  cache_dir: "data/scraped/http_cache"
  # Your institutional email – included in User-Agent for OpenAlex polite pool
  contact_email: "opentech-db@th-deg.de"

# ---------------------------------------------------------------------------
# Sources
# ---------------------------------------------------------------------------
sources:
  open_alex:
    enabled: true
    description: "OpenAlex – free, open academic graph (no API key required)"
    base_url: "https://api.openalex.org"
    max_results_per_tech: 50
    lookback_months: 36
    api_key: null

  semantic_scholar:
    enabled: true
    description: "Semantic Scholar – free AI-powered paper search"
    base_url: "https://api.semanticscholar.org/graph/v1"
    max_results_per_tech: 50
    lookback_months: 36
    api_key: null

  scopus:
    enabled: false
    description: "Elsevier Scopus – premium bibliographic database"
    api_key: null
    inst_token: null
    max_results_per_tech: 30
    lookback_months: 36

  google_scholar:
    enabled: false
    description: "Google Scholar via 'scholarly' library (experimental)"
    max_results_per_tech: 20
    lookback_months: 36
    proxy_key: null

  nrel_atb:
    enabled: true
    description: "NREL Annual Technology Baseline – authoritative US cost data"
    base_url: "https://atb.nrel.gov"
    atb_year: 2024

  irena:
    enabled: true
    description: "IRENA Renewable Power Generation Costs – annual PDF reports"
    base_url: "https://www.irena.org"
    report_index_url: "https://www.irena.org/publications/2024/Sep/Renewable-power-generation-costs-in-2023"

  eia_api:
    enabled: true
    description: "US EIA Open Data – electricity generation, capacity, cost surveys"
    base_url: "https://api.eia.gov/v2"
    api_key: null                # Free key at https://www.eia.gov/opendata/register.php

  crossref:
    enabled: true
    description: "Crossref REST API – DOI metadata, open access, fast free tier"
    base_url: "https://api.crossref.org"
    max_results_per_tech: 40
    lookback_months: 36

  arxiv:
    enabled: true
    description: "arXiv preprint server – free API, no key required"
    base_url: "https://export.arxiv.org/api"
    max_results_per_tech: 30
    lookback_months: 24

  europe_pmc:
    enabled: true
    description: "Europe PMC – life sciences + energy literature, free API"
    base_url: "https://www.ebi.ac.uk/europepmc/webservices/rest"
    max_results_per_tech: 30
    lookback_months: 36

  iea_reports:
    enabled: true
    description: "IEA publication index – World Energy Outlook, Technology Reports"
    report_index_url: "https://www.iea.org/data-and-statistics/data-product/world-energy-outlook-2023"

  fraunhofer_ise:
    enabled: true
    description: "Fraunhofer ISE photovoltaics + energy system reports (PDF scrape)"
    reports:
      - "https://www.ise.fraunhofer.de/content/dam/ise/de/documents/publications/studies/Photovoltaics-Report.pdf"

  ember_data:
    enabled: true
    description: "Ember Climate – open electricity data & reports"
    base_url: "https://ember-climate.org/data"
    api_url: "https://api.ember-climate.org/v1"

# ---------------------------------------------------------------------------
# Extraction settings
# ---------------------------------------------------------------------------
extraction:
  # Minimum confidence score (0-1) to create a candidate
  min_confidence: 0.55
  # If true, discard results without a DOI
  require_doi: false
  # If true, attempt to download and parse open-access PDFs
  parse_pdfs: true
  # Max PDF size in MB to attempt parsing (avoids downloading 200-page reports)
  max_pdf_mb: 10
  # LLM extraction (optional – requires OPENAI_API_KEY env var)
  llm:
    enabled: false
    provider: "openai"           # "openai" | "anthropic"
    model: "gpt-4o-mini"         # cost-effective for bulk extraction
    max_tokens_per_paper: 3000   # truncate paper text before sending to LLM
    temperature: 0.0
    # Prompt template used to instruct the LLM
    system_prompt: |
      You are an expert energy systems engineer. Extract cost and performance
      parameters from the provided paper excerpt. Return ONLY valid JSON with
      the following fields if found in the text, otherwise omit the field:
      {
        "capex_usd_per_kw": number,
        "opex_fixed_usd_per_kw_yr": number,
        "opex_var_usd_per_mwh": number,
        "efficiency_percent": number,
        "lifetime_years": number,
        "co2_emission_factor_g_per_kwh": number,
        "typical_capacity_mw": number,
        "notes": "brief explanation of extracted values and their context"
      }
      All monetary values must be in USD. Convert from EUR using 1 EUR = 1.10 USD.
      All efficiencies must be in % (e.g. 60.5 not 0.605).

# ---------------------------------------------------------------------------
