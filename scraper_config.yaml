# scraper_config.yaml
# ====================
# Configuration for the OpenTech-DB automated scraping pipeline.
# Edit this file to control which sources are active, scheduling frequency,
# technology-specific search queries, and extraction thresholds.
#
# Environment variables override file settings where noted (see scrapers/config.py).
# ====================

# ---------------------------------------------------------------------------
# Scheduling
# Runs twice a month by default (1st and 15th at 02:00 UTC).
# Cron format: minute hour day-of-month month day-of-week
# ---------------------------------------------------------------------------
schedule:
  enabled: true
  jobs:
    - id: "scrape_run_1"
      cron: "0 2 1 * *"      # 1st of every month, 02:00 UTC
      description: "Monthly scrape run – start of month"
    - id: "scrape_run_2"
      cron: "0 2 15 * *"     # 15th of every month, 02:00 UTC
      description: "Monthly scrape run – mid month"

# ---------------------------------------------------------------------------
# HTTP Client settings
# ---------------------------------------------------------------------------
http:
  timeout_seconds: 30
  max_retries: 3
  retry_backoff_seconds: 2.0   # exponential base
  # Polite delay between requests to the same host (seconds)
  rate_limit_delay: 1.5
  # Cache raw responses to disk to avoid duplicate fetches within a run
  cache_enabled: true
  cache_ttl_hours: 24
  cache_dir: "data/scraped/http_cache"
  # Your institutional email – included in User-Agent for OpenAlex polite pool
  contact_email: "opentech-db@th-deg.de"

# ---------------------------------------------------------------------------
# Sources
# ---------------------------------------------------------------------------
sources:
  open_alex:
    enabled: true
    description: "OpenAlex – free, open academic graph (no API key required)"
    base_url: "https://api.openalex.org"
    max_results_per_tech: 50
    lookback_months: 36
    api_key: null

  semantic_scholar:
    enabled: false
    description: "Semantic Scholar – free AI-powered paper search (disabled: no API key = heavy rate limits)"
    base_url: "https://api.semanticscholar.org/graph/v1"
    max_results_per_tech: 50
    lookback_months: 36
    api_key: null

  scopus:
    enabled: false
    description: "Elsevier Scopus – premium bibliographic database"
    api_key: null
    inst_token: null
    max_results_per_tech: 30
    lookback_months: 36

  google_scholar:
