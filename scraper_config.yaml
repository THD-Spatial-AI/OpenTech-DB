# ---------------------------------------------------------------------------
# Output / storage
# ---------------------------------------------------------------------------
output:
  # Root directory for all scraper output (relative to project root)
  base_dir: "data/scraped"
  # Sub-directories
  raw_dir: "data/scraped/raw"
  candidates_dir: "data/scraped/candidates"
  runs_dir: "data/scraped/runs"
  # Indent for JSON output
  json_indent: 2
  # Deduplicate candidates by DOI within a run
  dedup_by_doi: true
  # Incremental runs: skip tech×source pairs scraped within N days (0 = disabled)
  incremental_cooldown_days: 7
